- defaults:
    link:
      relink: true
    shell:
      quiet: true
      stdin: true
      stdout: true

- clean:
    ~/:
    ~/.config:
      recursive: true

- link:
    ~/.bash_aliases:
      force: true
      path: files/bash_aliases
    ~/.bash_functions:
      force: true
      path: files/bash_functions
    ~/.config/starship.toml:
      glob: true
      create: true
      path: files/config/starship.toml
    ~/.config/mytheme.omp.yaml:
      glob: true
      create: true
      path: files/config/mytheme.omp.yaml
    ~/.bashrc:
      force: true
      path: files/bashrc
    ~/.gitconfig: files/gitconfig
    ~/.vimrc:
      force: true
      path: files/vimrc
    ~/.inputrc:
      force: true
      path: files/inputrc
    ~/.bash_env:
      force: true
      path: files/bash_env
    ~/.tmux.conf:
      force: true
      path: files/tmux.conf

- create:
    ~/downloads:
    ~/.vim/undo-history:
    ~/bin:
    ~/.ssh:
      mode: 0700

- shell:
    - command: ./scripts/40-install-nvim.sh
    - command: ./scripts/50-get-public-keys.sh
    - command: ./scripts/50-install-fzf.sh
    - command: ./scripts/50-install-omp.sh
    - command: ./scripts/50-install-x-cmd.sh
    - command: ./scripts/60-install-source-highlight.sh
    # - command: ./run-all-scripts.sh
    #   description: Running scripts
